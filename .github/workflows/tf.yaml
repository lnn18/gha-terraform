on:
  push

jobs:

  tfsec:
      permissions:
        contents: read # for actions/checkout to fetch code
        security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
        actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      
      name: tfsec
      runs-on: ubuntu-latest

      steps:
        - name: Clone repo
          uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        - name: tfsec
          uses: aquasecurity/tfsec-action@v1.0.0
          with:
            format: sarif
            additional-args: --out results.sarif
            soft_fail: true
        
        - run: ls -la
        
        - name: Upload SARIF file
        # @v4.31.9
          uses: github/codeql-action/upload-sarif@c43362b91a940600cde2ebae39ec7a35ad66bdc0
          
          # Results are generated only on a success or failure
          # this is required since GitHub by default won't run the next step
          # when the previous one has failed. Security checks that do not pass will 'fail'.
          # An alternative is to add `continue-on-error: true` to the previous step
          # Or 'soft_fail: true' to checkov.
          if: success() || failure()
          with:
            sarif_file: results.sarif

  scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
      
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so follow-up steps can access it
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Checkov GitHub Action
      # checov @v12.307
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf
        with:
          # This will add both a CLI output to the console and create a results.sarif file
          output_format: sarif
          output_file_path: results.sarif
          skip_check: CKV_AWS_144  # Example to skip specific checks
        
      - name: Upload SARIF file
      # @v4.31.9
        uses: github/codeql-action/upload-sarif@c43362b91a940600cde2ebae39ec7a35ad66bdc0
        
        # Results are generated only on a success or failure
        # this is required since GitHub by default won't run the next step
        # when the previous one has failed. Security checks that do not pass will 'fail'.
        # An alternative is to add `continue-on-error: true` to the previous step
        # Or 'soft_fail: true' to checkov.
        if: success() || failure()
        with:
          sarif_file: results.sarif

  terraform:
    runs-on: ubuntu-latest
    needs: [tfsec, scan]
    env: 
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: set up terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.1.7"
      - name: terraform init
        run: terraform init -reconfigure
      - name: terraform format
        run: terraform fmt
      - name: terraform validate
        run: terraform validate
      - name: teraform plan
        run: terraform plan -out=tfplan
      - name: terraform apply
        run: terraform apply "tfplan"



